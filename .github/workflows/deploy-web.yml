name: Deploy Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Клонирование
        uses: actions/checkout@v4

      - name: 🟢 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Установка библиотек
        run: npm ci

      - name: 🏗️ Сборка веб-версии
        run: npx expo export -p web

      - name: ⚙️ Настройка GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Загрузка артефактов Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 🚀 Публикация на сайт
        id: deployment
        uses: actions/deploy-pages@v4